<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex" />
  <title>ResidenQuest - Recuperación</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f3ff;
      margin: 0;
      padding: 24px;
    }

    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      color: #4b2aad;
    }

    .hint {
      margin-top: 10px;
      color: #666;
      line-height: 1.5;
    }

    .row {
      margin-top: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #333;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    button {
      margin-top: 16px;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #673ab7;
      color: #fff;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .ok {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .err {
      background: #ffebee;
      color: #b71c1c;
    }
  </style>

  <!-- Exact pinned Supabase JS 2.111.0 UMD browser build with SRI -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"
    integrity="sha384-faMlYZUtkJj+Sh6Bmu/L0GzPcraRWN6CW+9RH3GUrK/Z0WS9tgaNNt0tHiLxsbdb"
    crossorigin="anonymous">
  </script>
</head>

<body>
  <div class="card">
    <div class="title">ResidenQuest</div>

    <div class="hint">
      Establece una nueva contraseña para tu cuenta.
    </div>

    <div id="status" class="msg" style="display:none;"></div>

    <div class="row">
      <label>Nueva contraseña</label>
      <input
        id="pw1"
        type="password"
        placeholder="Mínimo 8 caracteres"
      />
    </div>

    <div class="row">
      <label>Confirmar contraseña</label>
      <input
        id="pw2"
        type="password"
        placeholder="Repite tu contraseña"
      />
    </div>

    <button id="btn" type="button">
      Guardar nueva contraseña
    </button>
  </div>

  <script>
    const SUPABASE_URL =
      "https://hfknqqsnzmvixvodgkpm.supabase.co";

    // Your publishable key is fine here.
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_euRrSBnYzneBY0qLrBI2ow_forlipav";

    const statusEl = document.getElementById("status");
    const btnEl = document.getElementById("btn");

    // Once the recovery session has been successfully established, remember it
    // for this page lifetime so a retry does not depend on credentials remaining
    // in the URL.
    let recoverySessionEstablished = false;

    // If the URL explicitly tells us this is an invalid/expired auth callback
    // or a non-recovery callback, keep password reset disabled for this page.
    let recoveryLinkBlocked = false;

    function showStatus(type, text) {
      statusEl.style.display = "block";
      statusEl.className =
        "msg " + (type === "ok" ? "ok" : "err");
      statusEl.textContent = text;
    }

    // Helpful, but do not rely on these as the only error UX.
    window.addEventListener("error", (e) => {
      showStatus(
        "err",
        "JS error: " + (e.message || e.error)
      );
    });

    window.addEventListener("unhandledrejection", (e) => {
      const msg =
        (
          e?.reason &&
          (
            e.reason.message ||
            e.reason.error_description ||
            e.reason.error
          )
        ) ||
        String(e.reason);

      showStatus("err", "Error: " + msg);
    });

    // Create the client only if Supabase JS actually loaded.
    // This prevents a secondary TypeError if the CDN itself fails
    // or if the browser rejects the external script because of SRI.
    let sb = null;

    if (!window.supabase?.createClient) {
      showStatus(
        "err",
        "No se pudo cargar Supabase JS (CDN). Revisa conexión o el script tag."
      );

      btnEl.disabled = true;
    } else {
      // Avoid global name collision: use `sb` not `supabase`.
      sb = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: false,
            autoRefreshToken: false,
            detectSessionInUrl: false,
          }
        }
      );
    }

    function getParams() {
      const hash =
        window.location.hash.startsWith("#")
          ? window.location.hash.substring(1)
          : "";

      const hashParams = new URLSearchParams(hash);
      const queryParams =
        new URLSearchParams(window.location.search);

      return {
        access_token: hashParams.get("access_token"),
        refresh_token: hashParams.get("refresh_token"),
        type:
          hashParams.get("type") ||
          queryParams.get("type"),
        code: queryParams.get("code"),
        error:
          hashParams.get("error") ||
          queryParams.get("error"),
        error_code:
          hashParams.get("error_code") ||
          queryParams.get("error_code"),
        error_description:
          hashParams.get("error_description") ||
          queryParams.get("error_description"),
      };
    }

    async function ensureSessionFromLink() {
      // If the session was already established during a previous attempt on
      // this page, do not require the recovery tokens to still be in the URL.
      if (recoverySessionEstablished) {
        return;
      }

      if (!sb) {
        throw new Error("Supabase JS no está disponible.");
      }

      const p = getParams();

      if (
        p.error ||
        p.error_code ||
        p.error_description
      ) {
        throw new Error(
          p.error_description ||
          p.error_code ||
          p.error
        );
      }

      if (
        p.type &&
        p.type !== "recovery"
      ) {
        throw new Error(
          "Este enlace no es de recuperación."
        );
      }

      if (p.access_token && p.refresh_token) {
        const { data, error } =
          await sb.auth.setSession({
            access_token: p.access_token,
            refresh_token: p.refresh_token,
          });

        if (error) {
          throw error;
        }

        recoverySessionEstablished = true;
        return data.session;
      }

      if (p.code) {
        const { data, error } =
          await sb.auth.exchangeCodeForSession(p.code);

        if (error) {
          throw error;
        }

        recoverySessionEstablished = true;
        return data.session;
      }

      throw new Error(
        "No se encontró sesión en el enlace. Abre este link desde el correo de recuperación."
      );
    }

    function clearRecoveryCredentialsFromUrl() {
      if (window.history.replaceState) {
        window.history.replaceState(
          null,
          document.title,
          window.location.pathname
        );
      }
    }

    function friendlySupabaseError(err) {
      const raw =
        (
          err &&
          (
            err.message ||
            err.error_description ||
            err.error
          )
        )
          ? (
              err.message ||
              err.error_description ||
              err.error
            )
          : String(err);

      const m = raw.toLowerCase();

      // Messages can vary across Supabase/Auth versions, so match broadly.
      if (
        m.includes("same password") ||
        (
          m.includes("different") &&
          m.includes("password")
        )
      ) {
        return "La nueva contraseña debe ser diferente a la anterior.";
      }

      if (
        m.includes("password") &&
        (
          m.includes("least") ||
          m.includes("short") ||
          m.includes("8")
        )
      ) {
        return "La contraseña debe tener al menos 8 caracteres.";
      }

      if (
        m.includes("expired") ||
        m.includes("otp_expired") ||
        (
          m.includes("invalid") &&
          (
            m.includes("token") ||
            m.includes("link")
          )
        )
      ) {
        return "El enlace de recuperación expiró o ya no es válido. Solicita uno nuevo desde la app.";
      }

      return "No se pudo actualizar la contraseña. Intenta de nuevo.";
    }

    async function resetPassword() {
      if (!sb) {
        showStatus(
          "err",
          "No se pudo cargar Supabase JS (CDN). Revisa tu conexión e intenta nuevamente."
        );
        return;
      }

      if (recoveryLinkBlocked) {
        return;
      }

      const originalText = btnEl.textContent;

      btnEl.disabled = true;
      btnEl.textContent = "Guardando…";

      try {
        // Do NOT trim passwords (spaces can be valid characters).
        const pw1 =
          document.getElementById("pw1").value;

        const pw2 =
          document.getElementById("pw2").value;

        if (!pw1 || !pw2) {
          showStatus(
            "err",
            "Por favor completa ambos campos."
          );
          return;
        }

        if (pw1.length < 8) {
          showStatus(
            "err",
            "La contraseña debe tener al menos 8 caracteres."
          );
          return;
        }

        if (pw1 !== pw2) {
          showStatus(
            "err",
            "Las contraseñas no coinciden."
          );
          return;
        }

        await ensureSessionFromLink();

        // The Supabase client now owns the recovery session. Remove the
        // access/refresh tokens (or PKCE code fallback) from the visible URL
        // and browser history before updating the password.
        clearRecoveryCredentialsFromUrl();

        const { error } =
          await sb.auth.updateUser({
            password: pw1
          });

        if (error) {
          throw error;
        }

        showStatus(
          "ok",
          "✅ Contraseña actualizada. Ya puedes volver a la app e iniciar sesión."
        );
      } catch (err) {
        showStatus(
          "err",
          friendlySupabaseError(err)
        );
      } finally {
        if (!recoveryLinkBlocked) {
          btnEl.disabled = false;
        }

        btnEl.textContent = originalText;
      }
    }

    // Hook button without inline onclick.
    btnEl.addEventListener(
      "click",
      resetPassword
    );

    // Immediately reject callbacks that Supabase explicitly reports as failed,
    // as well as callbacks explicitly belonging to a different auth flow.
    (function () {
      const p = getParams();

      if (
        p.error ||
        p.error_code ||
        p.error_description
      ) {
        recoveryLinkBlocked = true;
        btnEl.disabled = true;

        showStatus(
          "err",
          "El enlace de recuperación expiró o ya no es válido. Solicita uno nuevo desde la app."
        );

        return;
      }

      if (
        p.type &&
        p.type !== "recovery"
      ) {
        recoveryLinkBlocked = true;
        btnEl.disabled = true;

        showStatus(
          "err",
          "Este enlace no es de recuperación (type=" +
            p.type +
            ")."
        );
      }
    })();
  </script>
</body>
</html>
