<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <meta
    name="robots"
    content="noindex"
  />

  <title>Turnstile</title>

  <link
    rel="preconnect"
    href="https://challenges.cloudflare.com"
  />

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=renderTurnstile"
    defer>
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 100vh;
    }

    .hint {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hint">Verificando…</div>

    <div id="turnstile-widget"></div>
  </div>

  <script>
    let completed = false;
    let watchdogId = null;

    function hasFlutterChannel() {
      return !!(
        window.Captcha &&
        window.Captcha.postMessage
      );
    }

    function send(msg) {
      if (hasFlutterChannel()) {
        window.Captcha.postMessage(
          String(msg)
        );
      }
    }

    function complete(msg) {
      if (completed) {
        return;
      }

      completed = true;

      if (watchdogId !== null) {
        window.clearTimeout(watchdogId);
      }

      send(msg);
    }

    function onSuccess(token) {
      const t = (token || "").trim();

      if (!t) {
        complete("ERROR:EMPTY_TOKEN");
        return;
      }

      complete(t);
    }

    function onError(errorCode) {
      const code = String(
        errorCode || "UNKNOWN"
      ).trim();

      complete(
        "ERROR:" + code
      );
    }

    function onExpired() {
      complete("EXPIRED");
    }

    function onTimeout() {
      complete("ERROR:TIMEOUT");
    }

    function onUnsupported() {
      complete("ERROR:UNSUPPORTED");
    }

    function getTurnstileSize() {
      return window.innerWidth < 300
        ? "compact"
        : "normal";
    }

    function renderTurnstile() {
      try {
        window.turnstile.render(
          "#turnstile-widget",
          {
            sitekey: "0x4AAAAAACNJalFqU3pVBzT2",
            size: getTurnstileSize(),
            callback: onSuccess,
            "error-callback": onError,
            "expired-callback": onExpired,
            "timeout-callback": onTimeout,
            "unsupported-callback": onUnsupported,
            retry: "never",
            "refresh-expired": "never",
            "refresh-timeout": "never"
          }
        );
      } catch (_) {
        complete("ERROR:RENDER");
      }
    }

    watchdogId = window.setTimeout(
      function () {
        complete("ERROR:WATCHDOG");
      },
      45000
    );
  </script>
</body>
</html>
